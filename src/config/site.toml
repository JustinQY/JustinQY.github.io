[config.site]
title = "Homelander"
description = "Personal developer portfolio and technical blog by Gary."
pageTitle = "Gary | iOS Developer & AI Enthusiast"
pageDescription = "A clean developer portfolio and blog for software quality, test automation, backend systems, data, and machine learning notes."
repository = "https://github.com/JustinQY/JustinQY.github.io"
footerNote = "Built with Astro Navfolio."

[config.vibe]
showTrail = true

[config.theme]
palette = "green-soft"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.comments]
enabled = false
provider = "none"
show_on_posts = false

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search articles..."
maxResults = 8

[config.blog]
postsPerPage = 6

