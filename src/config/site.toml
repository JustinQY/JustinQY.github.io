[config.site]
title = "Homelander"
description = "Personal developer portfolio and technical blog by Gary."
pageTitle = "Gary | iOS Developer & ML Enthusiast"
pageDescription = "A clean developer portfolio and blog for software quality, test automation, backend systems, data, and machine learning notes."
repository = "https://github.com/JustinQY/JustinQY.github.io"
footerNote = "Built with Astro Navfolio."

[config.vibe]
showTrail = true

[config.theme]
palette = "green-soft"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.comments]
enabled = false
provider = "none"
show_on_posts = false

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search articles..."
maxResults = 8

[config.blog]
postsPerPage = 6

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
